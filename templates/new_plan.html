{% extends "base.html" %}
{% block title %}New plan · FitBuddy{% endblock %}
{% block nav_new %}active{% endblock %}
{% block content %}
{% set cur = user.intensity or 'medium' %}
<section class="auth">
  <form action="/generate-workout" method="post" class="card form wide">
    <span class="pill">● Hi {{ user.username }}</span>
    <h2>Build a new plan</h2>
    <div class="row three">
      <label>Age<input type="number" id="age" name="age" value="{{ user.age or '' }}" placeholder="25" required></label>
      <label>Height (cm)<input type="number" id="height" name="height" value="{{ user.height or '' }}" placeholder="175" required></label>
      <label>Weight (kg)<input type="number" id="weight" name="weight" value="{{ user.weight or '' }}" placeholder="70" required></label>
    </div>
    <label>Fitness goal
      <input type="text" id="goal" name="goal" value="{{ user.goal or '' }}" placeholder="e.g. Build muscle" required>
    </label>
    <div class="chips">
      <button type="button" class="chip">Build muscle</button>
      <button type="button" class="chip">Lose fat</button>
      <button type="button" class="chip">Improve stamina</button>
      <button type="button" class="chip">Stay flexible</button>
    </div>
    <fieldset class="seg">
      <legend>Intensity</legend>
      <input type="radio" name="intensity" id="i-low" value="low" {{ 'checked' if cur == 'low' }}><label for="i-low">Low<small>Beginner</small></label>
      <input type="radio" name="intensity" id="i-med" value="medium" {{ 'checked' if cur == 'medium' }}><label for="i-med">Medium<small>Sweaty</small></label>
      <input type="radio" name="intensity" id="i-high" value="high" {{ 'checked' if cur == 'high' }}><label for="i-high">High<small>All out</small></label>
    </fieldset>
    <button type="submit" class="btn" id="go">Generate my plan →</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
document.querySelectorAll('.chip').forEach(function(c){
  c.onclick=function(){document.getElementById('goal').value=c.textContent;};
});
document.querySelector('form.form').addEventListener('submit',function(){
  var b=document.getElementById('go');b.textContent='Generating… this takes a few seconds';b.classList.add('busy');
});
</script>
{% endblock %}
